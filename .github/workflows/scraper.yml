name: Maj hebdo pharmacies de garde

on:
  schedule:
    # Scan chaque heure, du dimanche au mardi, pour ne jamais rater
    # la publication de la nouvelle semaine par l'INAM (l'heure exacte
    # n'est pas garantie de leur cote). Sans risque de repetition : le
    # script ne fait que confirmer si rien n'a change.
    - cron: "0 * * * 0,1,2"
  workflow_dispatch: {}   # permet de lancer le scraper manuellement depuis GitHub, pour tester

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Lancer le scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper_gardes.py
