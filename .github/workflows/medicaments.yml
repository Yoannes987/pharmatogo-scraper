name: Maj mensuelle catalogue medicaments

on:
  schedule:
    # Le 5 du mois a 21h17 UTC (= 21h17 a Lome, meme heure). Le 5 est un jour
    # de paie : c'est la que l'INAM a le plus de chances de publier. Le soir,
    # apres les heures de bureau, on capte une mise a jour faite dans la
    # journee, et le site est peu charge.
    #
    # Reconfirmation les 6, 7 et 10 : le script ne retient que ce qui a
    # change. Si l'INAM a deja publie, les passages suivants disent
    # "catalogue deja a jour" et ne touchent a rien. S'il publie en retard,
    # on le rattrape. (:17 et non :00 -> les heures rondes sont saturees.)
    - cron: "17 21 5,6,7,10 * *"
  workflow_dispatch: {}   # bouton "Run workflow" sur GitHub, pour lancer a la main

jobs:
  scrape:
    runs-on: ubuntu-latest
    # La page fait ~25 Mo et contient 14 000 lignes a analyser : on laisse
    # de la marge, mais on coupe si ca part en boucle.
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Lancer le scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper_medicaments.py
